<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Orchboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app/web/main.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="/">
          <img class="brand-logo" src="/assets/logo-128.png" alt="" width="36" height="36" />
          <span class="brand-name">Orchboard</span>
        </a>
        <nav class="projects" aria-label="Projects">
          <div class="sidebar-heading-row">
            <h2 class="sidebar-heading">Projects</h2>
            <button
              id="add-project"
              class="icon-button"
              type="button"
              aria-label="Add project"
              title="Add project"
            >
              +
            </button>
          </div>
          <ul id="project-list" class="project-list"></ul>
        </nav>
        <div class="sidebar-footer">
          <button id="open-skills" class="button button-quiet" type="button">
            <svg
              class="button-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3.5 13.9 9l5.6 2-5.6 2L12 18.5 10.1 13 4.5 11l5.6-2z" />
              <path d="M18.5 3.5v3M17 5h3" />
            </svg>
            Skills
          </button>
          <button id="open-settings" class="button button-quiet" type="button">
            <svg
              class="button-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
            Settings
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 class="visually-hidden">Orchboard</h1>
          <div class="view-switch" role="group" aria-label="View">
            <button class="view-button" type="button" data-view="board" aria-pressed="true">
              Board
            </button>
            <button class="view-button" type="button" data-view="list" aria-pressed="false">
              List
            </button>
            <button
              class="view-button"
              type="button"
              data-view="docs"
              aria-pressed="false"
              title="Edit the selected project's CLAUDE.md and AGENTS.md"
            >
              Docs
            </button>
          </div>
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search tasks"
            aria-label="Search tasks"
            autocomplete="off"
          />
          <span id="connection" class="connection" role="status" data-state="connecting">
            Connecting…
          </span>
          <button id="new-task" class="button button-primary" type="button">New task</button>
        </header>
        <p id="notice" class="notice" role="alert" hidden></p>
        <div id="hidden-bar" class="hidden-bar" hidden>
          <span id="hidden-label"></span>
          <button id="hidden-toggle" class="link-button" type="button">Show</button>
          <button id="hidden-reset" class="link-button" type="button">Unhide all</button>
        </div>
        <div id="board" class="board"></div>
        <div id="docs" class="board docs" hidden></div>
      </main>
    </div>
    <section id="usage" class="usage-widget" aria-label="Plan usage" hidden></section>
    <noscript><p class="noscript">Orchboard needs JavaScript enabled.</p></noscript>
  </body>
</html>
